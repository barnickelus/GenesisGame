<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis Evolution — Cellular Phase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    :root { --ui-color: #f0f0f0; --neon-cyan: #00f0ff; --neon-magenta: #ff0055; --neon-green: #39ff14; }
    body { margin: 0; overflow: hidden; background: #000; font-family: "Inter", sans-serif; color: var(--ui-color); touch-action: none; user-select: none; }
    
    #bg-canvas { position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none; }
    #webgl-container { position: absolute; top: 0; left: 0; z-index: 1; outline: none;}
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
    
    /* Subtle HUD */
    #hud { position: absolute; top: 20px; left: 20px; }
    .hud-title { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.5; margin-bottom: 6px; }
    #mass-container { width: 200px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    #mass-bar { height: 100%; width: 5%; background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); transition: width 0.2s ease-out; }
    #status { margin-top: 8px; font-size: 12px; font-weight: 300; letter-spacing: 2px; }

    /* Unobtrusive Evolution Trigger */
    #evo-trigger { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 30px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); font-family: "Inter"; font-size: 12px; letter-spacing: 3px; cursor: pointer; border-radius: 4px; pointer-events: auto; display: none; text-shadow: 0 0 8px var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); animation: pulse 2s infinite; transition: all 0.3s; }
    #evo-trigger:hover { background: rgba(0, 240, 255, 0.2); transform: translateX(-50%) scale(1.05); }

    @keyframes pulse { 0% { box-shadow: 0 0 10px rgba(0,240,255,0.2); } 50% { box-shadow: 0 0 25px rgba(0,240,255,0.6); } 100% { box-shadow: 0 0 10px rgba(0,240,255,0.2); } }

    /* Center Modal for Evolution (Replaces Side Panel) */
    #evo-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 20; opacity: 0; transition: opacity 0.4s; }
    #evo-modal.active { display: flex; opacity: 1; }
    .modal-header { font-size: 24px; font-weight: 300; letter-spacing: 4px; margin-bottom: 40px; text-transform: uppercase; }
    .choices-grid { display: flex; gap: 20px; max-width: 900px; }
    .evo-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 8px; cursor: pointer; width: 250px; text-align: center; transition: all 0.3s; }
    .evo-card:hover { background: rgba(255,255,255,0.08); transform: translateY(-10px); }
    .evo-name { font-size: 16px; font-weight: 600; margin-bottom: 15px; letter-spacing: 2px; }
    .evo-desc { font-size: 12px; opacity: 0.6; line-height: 1.6; }

    #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 30; }
    #game-over h1 { color: var(--neon-magenta); font-weight: 300; letter-spacing: 5px; }
    button { background: none; border: 1px solid #fff; color: #fff; padding: 10px 30px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; margin-top: 20px;}
    button:hover { background: #fff; color: #000; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="webgl-container"></div>

<div id="ui-layer">
    <div id="hud">
        <div class="hud-title">Biomass / Complexity</div>
        <div id="mass-container"><div id="mass-bar"></div></div>
        <div id="status">STAGE: ORGANIC BASELINE</div>
    </div>

    <button id="evo-trigger">EVOLUTION AVAILABLE</button>

    <div id="evo-modal">
        <div class="modal-header">Select Genetic Mutation</div>
        <div class="choices-grid" id="choices-container"></div>
    </div>

    <div id="game-over">
        <h1>CELLULAR DEATH</h1>
        <p style="opacity: 0.6; font-size: 14px;">Consumed by a larger entity.</p>
        <button onclick="location.reload()">Reincarnate</button>
    </div>
</div>

<script>
/** * GENESIS EVOLUTION — Cellular Phase
 * Emphasizing organic growth, dynamic predator/prey AI, and unobtrusive UI.
 */

/* =========================================
   1. EVOLUTIONARY TRAITS
   ========================================= */
const TRAITS = {
    Flagellum: { name: 'Ciliated Flagellum', color: 0x00f0ff, speed: 25, handling: 0.1, tailLengthMulti: 1.5, desc: "High mobility and agility. Tail structures multiply to allow rapid escape and hunting." },
    Carapace: { name: 'Chitinous Shell', color: 0x39ff14, speed: 15, handling: 0.05, tailLengthMulti: 0.5, desc: "Slower, heavily armored. Can safely bounce off entities up to 20% larger without dying." },
    Predator: { name: 'Predatory Maw', color: 0xff0055, speed: 20, handling: 0.08, tailLengthMulti: 1.0, desc: "Aggressive consumption. Can eat entities up to 5% larger than yourself." }
};

/* =========================================
   2. UI & GRID VISUALS (2D Canvas)
   ========================================= */
class UIController {
    constructor() {
        this.bgCanvas = document.getElementById('bg-canvas');
        this.ctx = this.bgCanvas.getContext('2d', { alpha: false });
        this.massBar = document.getElementById('mass-bar');
        this.status = document.getElementById('status');
        this.evoTrigger = document.getElementById('evo-trigger');
        this.evoModal = document.getElementById('evo-modal');
        this.choicesContainer = document.getElementById('choices-container');
        this.gameOver = document.getElementById('game-over');
        
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        this.bgCanvas.width = window.innerWidth;
        this.bgCanvas.height = window.innerHeight;
    }

    updateHUD(player) {
        // Mass scales exponentially, so we log it for the progress bar
        const progress = Math.min(100, ((player.mass - 1) / (player.nextEvoMass - 1)) * 100);
        this.massBar.style.width = `${Math.max(5, progress)}%`;
        const color = `#${player.traits.color.toString(16).padStart(6, '0')}`;
        this.massBar.style.backgroundColor = color;
        this.massBar.style.boxShadow = `0 0 10px ${color}`;
        this.status.style.color = color;
    }

    drawGrid(playerPos, cameraY) {
        this.ctx.fillStyle = '#050505'; // Pure dark void
        this.ctx.fillRect(0, 0, this.bgCanvas.width, this.bgCanvas.height);
        
        // Zoom affects grid scale
        const zoom = 40 / cameraY; 
        const gridSize = 100 * zoom;
        
        const offsetX = (this.bgCanvas.width / 2 - playerPos.x * 5 * zoom) % gridSize;
        const offsetY = (this.bgCanvas.height / 2 - playerPos.z * 5 * zoom) % gridSize;

        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        this.ctx.lineWidth = 1;

        this.ctx.beginPath();
        for (let x = offsetX - gridSize; x < this.bgCanvas.width; x += gridSize) {
            this.ctx.moveTo(x, 0); this.ctx.lineTo(x, this.bgCanvas.height);
        }
        for (let y = offsetY - gridSize; y < this.bgCanvas.height; y += gridSize) {
            this.ctx.moveTo(0, y); this.ctx.lineTo(this.bgCanvas.width, y);
        }
        this.ctx.stroke();
    }

    toggleEvoTrigger(show) { this.evoTrigger.style.display = show ? 'block' : 'none'; }
    showGameOver() { this.gameOver.style.display = 'flex'; }

    openEvolutionModal(onSelect) {
        this.evoModal.classList.add('active');
        this.choicesContainer.innerHTML = '';
        Object.values(TRAITS).forEach(trait => {
            const el = document.createElement('div');
            el.className = 'evo-card';
            const hex = `#${trait.color.toString(16).padStart(6,'0')}`;
            el.innerHTML = `
                <div class="evo-name" style="color: ${hex}; text-shadow: 0 0 10px ${hex};">${trait.name}</div>
                <div class="evo-desc">${trait.desc}</div>
            `;
            el.onclick = () => {
                this.evoModal.classList.remove('active');
                this.toggleEvoTrigger(false);
                onSelect(trait);
            };
            this.choicesContainer.appendChild(el);
        });
    }
}

/* =========================================
   3. ENTITY & DYNAMIC AI
   ========================================= */
class Entity {
    constructor(scene, playerMass) {
        this.scene = scene;
        // Spawn sizes relative to player so there is always food and always threats
        this.mass = Math.max(0.2, playerMass * (0.3 + Math.random() * 1.5)); 
        this.radius = Math.pow(this.mass, 0.5); // Area = mass

        const geo = new THREE.SphereGeometry(this.radius, 16, 16);
        this.mat = new THREE.MeshBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        this.mesh = new THREE.Mesh(geo, this.mat);
        
        // Spawn in a ring outside immediate view
        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 100 * playerMass;
        this.mesh.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
        
        scene.add(this.mesh);
        
        this.velocity = new THREE.Vector3((Math.random()-0.5), 0, (Math.random()-0.5)).normalize().multiplyScalar(5);
        this.baseWander = Math.random() * 100;
    }

    update(dt, time, player) {
        const dist = this.mesh.position.distanceTo(player.mesh.position);
        const aggroRange = 40 * Math.max(1, Math.pow(player.mass, 0.3));
        
        // Behavior Algorithm Based on Size
        if (dist < aggroRange) {
            const dirToPlayer = new THREE.Vector3().subVectors(player.mesh.position, this.mesh.position).normalize();
            
            // Allow Predator trait to eat things slightly larger
            const sizeAdvantage = player.traits.name === 'Predatory Maw' ? 1.05 : 1.0;

            if (this.mass > player.mass * sizeAdvantage) {
                // I am larger -> HUNT
                this.mat.color.setHex(0xff0055); // Danger Magenta
                this.velocity.lerp(dirToPlayer.multiplyScalar(12), 0.05);
            } else {
                // I am smaller -> FLEE
                this.mat.color.setHex(0x00f0ff); // Prey Cyan
                this.velocity.lerp(dirToPlayer.multiplyScalar(-15), 0.08);
            }
        } else {
            // Idle wander
            this.mat.color.setHex(0x55aa55); // Neutral Green
            this.velocity.x += Math.sin(time + this.baseWander) * 0.1;
            this.velocity.z += Math.cos(time + this.baseWander) * 0.1;
            this.velocity.normalize().multiplyScalar(5); // Slow wander speed
        }

        this.mesh.position.add(this.velocity.clone().multiplyScalar(dt));
    }

    destroy() { this.scene.remove(this.mesh); }
}

class Player {
    constructor(scene) {
        this.scene = scene;
        this.mass = 1.0;
        this.nextEvoMass = 3.0; // Mass needed for first evolution
        this.traits = { name: 'Organic Baseline', color: 0xffffff, speed: 18, handling: 0.08, tailLengthMulti: 1.0 };
        this.isDead = false;
        
        this.mesh = new THREE.Mesh(
            new THREE.SphereGeometry(1, 32, 32),
            new THREE.MeshBasicMaterial({ color: this.traits.color, blending: THREE.AdditiveBlending })
        );
        scene.add(this.mesh);

        // Core Bioluminescence
        this.glow = new THREE.PointLight(this.traits.color, 2, 50);
        this.mesh.add(this.glow);

        // Kinematic Tail System
        this.history = [];
        this.tailMeshes = [];
        this.tailMat = new THREE.MeshBasicMaterial({ color: this.traits.color, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
        this.updateTailStructure();
    }

    evolve(trait) {
        this.traits = trait;
        this.nextEvoMass = this.mass * 2.5; // Next threshold scales up
        this.mesh.material.color.setHex(this.traits.color);
        this.glow.color.setHex(this.traits.color);
        this.tailMat.color.setHex(this.traits.color);
        document.getElementById('status').innerText = `STAGE: ${this.traits.name.toUpperCase()}`;
        this.updateTailStructure();
    }

    grow(consumedMass) {
        this.mass += consumedMass * 0.2; // Gain a fraction of consumed mass
        const newRadius = Math.pow(this.mass, 0.5);
        
        // Scale player mesh visually
        this.mesh.scale.setScalar(newRadius);
        this.glow.distance = 50 * newRadius;

        this.updateTailStructure();
    }

    updateTailStructure() {
        // Number of segments scales with mass and genetic trait
        const desiredSegments = Math.floor(this.mass * 5 * this.traits.tailLengthMulti);
        
        while(this.tailMeshes.length < desiredSegments) {
            const seg = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), this.tailMat);
            this.scene.add(seg);
            this.tailMeshes.push(seg);
        }
        // Remove excess if evolved into a shorter tail form
        while(this.tailMeshes.length > desiredSegments) {
            const seg = this.tailMeshes.pop();
            this.scene.remove(seg);
        }
    }

    update(dt, targetPos) {
        if(this.isDead) return;

        // Fluid cellular movement
        const dir = new THREE.Vector3().subVectors(targetPos, this.mesh.position);
        dir.y = 0;
        if(dir.length() > 0.5) {
            // Larger mass = slightly slower top speed but higher momentum
            const currentSpeed = this.traits.speed / Math.pow(this.mass, 0.2); 
            this.mesh.position.lerp(targetPos, this.traits.handling);
        }

        // Record history for kinematic tail
        this.history.unshift(this.mesh.position.clone());
        if(this.history.length > this.tailMeshes.length * 3 + 1) {
            this.history.pop();
        }

        // Update tail segments
        const radius = Math.pow(this.mass, 0.5);
        for(let i = 0; i < this.tailMeshes.length; i++) {
            const historyIdx = i * 3; // spacing
            if(this.history[historyIdx]) {
                const seg = this.tailMeshes[i];
                seg.position.lerp(this.history[historyIdx], 0.5);
                // Tail tapers off at the end
                const scale = radius * (1 - (i / this.tailMeshes.length)) * 0.8;
                seg.scale.setScalar(Math.max(0.1, scale)); 
            }
        }
    }
}

/* =========================================
   4. SIMULATION ENGINE
   ========================================= */
class Simulation {
    constructor() {
        this.ui = new UIController();
        this.initWebGL();
        
        this.player = new Player(this.scene);
        this.entities = [];
        this.targetPos = new THREE.Vector3();
        this.isPointerDown = false;
        this.isPaused = false;
        this.evoReady = false;

        this.setupInputs();
        
        // UI Bindings
        this.ui.evoTrigger.onclick = () => {
            this.isPaused = true;
            this.ui.openEvolutionModal((trait) => {
                this.player.evolve(trait);
                this.evoReady = false;
                this.isPaused = false;
            });
        };

        this.clock = new THREE.Clock();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
    }

    initWebGL() {
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setClearColor(0x000000, 0); 
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        document.getElementById('webgl-container').appendChild(this.renderer.domElement);
    }

    setupInputs() {
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        const updateTarget = (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, this.camera);
            raycaster.ray.intersectPlane(plane, this.targetPos);
        };

        window.addEventListener('pointerdown', (e) => { this.isPointerDown = true; updateTarget(e); });
        window.addEventListener('pointermove', (e) => { if(this.isPointerDown) updateTarget(e); });
        window.addEventListener('pointerup', () => { this.isPointerDown = false; });
    }

    maintainEcosystem() {
        // Keep a steady population of entities around the player
        const maxEntities = 80;
        while(this.entities.length < maxEntities) {
            this.entities.push(new Entity(this.scene, this.player.mass));
        }
    }

    checkCollisions() {
        if(this.player.isDead) return;
        
        const pRadius = Math.pow(this.player.mass, 0.5);
        const sizeAdvantage = this.player.traits.name === 'Predatory Maw' ? 1.05 : 1.0;
        const armorAdvantage = this.player.traits.name === 'Chitinous Shell' ? 1.2 : 1.0;

        for (let i = this.entities.length - 1; i >= 0; i--) {
            const e = this.entities[i];
            const dist = this.player.mesh.position.distanceTo(e.mesh.position);
            
            if (dist < pRadius + e.radius) {
                if (this.player.mass * sizeAdvantage > e.mass) {
                    // Consume
                    this.player.grow(e.mass);
                    e.destroy();
                    this.entities.splice(i, 1);
                } else {
                    // Attacked
                    if (e.mass < this.player.mass * armorAdvantage) {
                        // Armor saves you, bounce away (lose a tiny bit of mass)
                        this.player.mass = Math.max(1, this.player.mass - 0.1);
                        e.velocity.multiplyScalar(-1); 
                    } else {
                        // Death
                        this.player.isDead = true;
                        this.ui.showGameOver();
                    }
                }
            }
        }
    }

    animate() {
        requestAnimationFrame(this.animate);
        if(this.isPaused) return;

        const dt = this.clock.getDelta();
        const time = performance.now() * 0.001;

        if(!this.player.isDead) {
            // Target follows pointer, or player coasts if released
            if(!this.isPointerDown) {
                 const dir = new THREE.Vector3().subVectors(this.targetPos, this.player.mesh.position).normalize();
                 this.targetPos.copy(this.player.mesh.position).add(dir.multiplyScalar(0.1));
            }
            this.player.update(dt, this.targetPos);
            
            // Check Evolution Trigger
            if (this.player.mass >= this.player.nextEvoMass && !this.evoReady) {
                this.evoReady = true;
                this.ui.toggleEvoTrigger(true);
            }
        }

        this.maintainEcosystem();
        this.entities.forEach(e => e.update(dt, time, this.player));
        this.checkCollisions();

        // UI & Camera updates
        this.ui.updateHUD(this.player);
        
        // Camera zooms out dynamically based on player mass
        const targetCamY = 30 * Math.pow(this.player.mass, 0.4);
        this.camera.position.x += (this.player.mesh.position.x - this.camera.position.x) * 0.1;
        this.camera.position.z += (this.player.mesh.position.z + targetCamY*0.5 - this.camera.position.z) * 0.1;
        this.camera.position.y += (targetCamY - this.camera.position.y) * 0.05;
        this.camera.lookAt(this.player.mesh.position);

        this.ui.drawGrid(this.player.mesh.position, this.camera.position.y);

        this.renderer.render(this.scene, this.camera);
    }
}

// Boot
window.onload = () => { const sim = new Simulation(); };
</script>
</body>
</html>
