<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis Evolution - Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    :root { --ui-color: #e0e0e0; --bg: #030308; --panel-bg: rgba(10, 10, 15, 0.85); }
    body { margin: 0; overflow: hidden; background: var(--bg); font-family: "Inter", sans-serif; color: var(--ui-color); touch-action: none; user-select: none; }
    canvas { display: block; }
    
    /* HUD UI */
    #hud { position: fixed; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
    .hud-title { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; margin-bottom: 8px; }
    #energy-container { width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; position: relative; }
    #energy-bar { height: 100%; width: 50%; background: #fff; box-shadow: 0 0 10px #fff; transition: width 0.1s linear, background-color 0.5s, box-shadow 0.5s; }
    #status { margin-top: 8px; font-size: 14px; font-weight: 300; opacity: 0.8; }

    /* Side Panel - Evolution Interface */
    #side-panel { position: fixed; right: -350px; top: 0; width: 320px; height: 100%; background: var(--panel-bg); backdrop-filter: blur(10px); border-left: 1px solid rgba(255,255,255,0.1); transition: right 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 20; padding: 40px 20px; box-sizing: border-box; display: flex; flex-direction: column; }
    #side-panel.active { right: 0; }
    .panel-header { font-size: 18px; font-weight: 600; margin-bottom: 10px; letter-spacing: 1px; }
    .panel-desc { font-size: 13px; line-height: 1.6; opacity: 0.7; margin-bottom: 30px; }
    
    .evo-choice { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 15px; margin-bottom: 15px; cursor: pointer; border-radius: 4px; transition: all 0.3s ease; }
    .evo-choice:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); transform: translateX(-5px); }
    .evo-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .evo-stats { font-size: 11px; opacity: 0.6; line-height: 1.4; }
    
    #instructions { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: 0.4; pointer-events: none; letter-spacing: 1px; }
</style>
</head>
<body>

<div id="hud">
    <div class="hud-title">System Energy</div>
    <div id="energy-container"><div id="energy-bar"></div></div>
    <div id="status">Form: Human Prototype</div>
</div>

<div id="side-panel">
    <div class="panel-header">Evolutionary Divergence</div>
    <div class="panel-desc">Sufficient energy acquired. The environment demands adaptation. Choose your trajectory.</div>
    <div id="choices-container"></div>
</div>

<div id="instructions">Click and drag to direct entity. Consume nodes to gather energy.</div>

<script>
/** * GENESIS EVOLUTION - PROTOTYPE ARCHITECTURE
 * Modular simulation of life, adaptation, and energy constraints.
 */

/* =========================================
   1. EVOLUTION & TRAITS MODULE
   ========================================= */
const Evolutions = {
    human: {
        id: 'human', name: 'Technological Apex', color: 0x00aaff,
        stats: { speed: 1.5, baseDrain: 15, moveDrain: 25, gatherRate: 1.0 },
        desc: "Retain human characteristics. High control and speed, but highly inefficient energy consumption."
    },
    hybrid: {
        id: 'hybrid', name: 'Symbiotic Hybrid', color: 0x00e4b8,
        stats: { speed: 1.0, baseDrain: 5, moveDrain: 10, gatherRate: 1.5 },
        desc: "Merge with the ecosystem. Balanced adaptability. Extremely energy efficient."
    },
    alien: {
        id: 'alien', name: 'Deep Evolved', color: 0xff0055,
        stats: { speed: 2.2, baseDrain: 20, moveDrain: 15, gatherRate: 2.5 },
        desc: "Abandon human form. Predatory, volatile. Massive energy intake, but bleeds energy rapidly at rest."
    }
};

/* =========================================
   2. UI CONTROLLER
   ========================================= */
class UIController {
    constructor() {
        this.energyBar = document.getElementById('energy-bar');
        this.status = document.getElementById('status');
        this.sidePanel = document.getElementById('side-panel');
        this.choicesContainer = document.getElementById('choices-container');
    }

    updateEnergy(current, max, colorHex) {
        const pct = Math.max(0, Math.min(100, (current / max) * 100));
        this.energyBar.style.width = `${pct}%`;
        
        // Reactive color/glow based on current evolution
        const color = `#${colorHex.toString(16).padStart(6, '0')}`;
        this.energyBar.style.backgroundColor = color;
        this.energyBar.style.boxShadow = `0 0 ${pct/5}px ${color}`;
        
        if (pct < 20) this.energyBar.style.opacity = (Math.sin(Date.now() * 0.01) + 1) / 2 + 0.2; // Pulse when low
        else this.energyBar.style.opacity = 1;
    }

    setStatus(text) { this.status.innerText = `Form: ${text}`; }

    showEvolutionPanel(onSelect) {
        this.choicesContainer.innerHTML = '';
        Object.values(Evolutions).forEach(evo => {
            const el = document.createElement('div');
            el.className = 'evo-choice';
            el.innerHTML = `
                <div class="evo-name" style="color: #${evo.color.toString(16).padStart(6,'0')}">${evo.name}</div>
                <div class="evo-stats">${evo.desc}</div>
            `;
            el.onclick = () => {
                this.sidePanel.classList.remove('active');
                onSelect(evo);
            };
            this.choicesContainer.appendChild(el);
        });
        this.sidePanel.classList.add('active');
    }
}

/* =========================================
   3. ENTITY & ECOSYSTEM MODULE
   ========================================= */
class Player {
    constructor(scene) {
        this.maxEnergy = 1000;
        this.energy = 300;
        this.state = 'neutral'; // neutral, human, hybrid, alien
        
        // Default Stats
        this.traits = { speed: 1.0, baseDrain: 8, moveDrain: 15, gatherRate: 1.0, color: 0xffffff };
        
        // Visuals
        const geo = new THREE.SphereGeometry(1.5, 32, 32);
        this.mat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: this.traits.color, emissiveIntensity: 1, roughness: 0.1 });
        this.mesh = new THREE.Mesh(geo, this.mat);
        scene.add(this.mesh);

        this.light = new THREE.PointLight(this.traits.color, 2, 100);
        this.mesh.add(this.light);

        // Particle Trail (Simple implementation for low-power devices)
        this.trail = [];
        this.trailMat = new THREE.MeshBasicMaterial({ color: this.traits.color, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const trailGeo = new THREE.SphereGeometry(0.4, 8, 8);
        for(let i=0; i<20; i++) {
            const t = new THREE.Mesh(trailGeo, this.trailMat);
            t.visible = false;
            scene.add(t);
            this.trail.push(t);
        }
        this.trailIdx = 0;
    }

    evolve(evolutionData) {
        this.state = evolutionData.id;
        this.traits = { ...evolutionData.stats, color: evolutionData.color };
        
        // Update visuals
        this.mat.emissive.setHex(this.traits.color);
        this.light.color.setHex(this.traits.color);
        this.trailMat.color.setHex(this.traits.color);
    }

    update(dt, isMoving) {
        // Energy Mechanics
        let drain = this.traits.baseDrain;
        if (isMoving) drain += this.traits.moveDrain;
        
        this.energy -= drain * dt;
        this.energy = Math.max(0, Math.min(this.energy, this.maxEnergy));

        // Visual feedback based on energy
        const energyRatio = this.energy / this.maxEnergy;
        this.light.intensity = 1 + (energyRatio * 2);
        this.mat.emissiveIntensity = 0.5 + energyRatio;

        // Particle Trailing
        if (isMoving && Math.random() < 0.3) {
            const t = this.trail[this.trailIdx];
            t.position.copy(this.mesh.position);
            t.position.x += (Math.random() - 0.5);
            t.position.z += (Math.random() - 0.5);
            t.scale.setScalar(1);
            t.visible = true;
            this.trailIdx = (this.trailIdx + 1) % this.trail.length;
        }

        // Shrink trail
        this.trail.forEach(t => {
            if (t.visible) {
                t.scale.multiplyScalar(0.9);
                if(t.scale.x < 0.1) t.visible = false;
            }
        });
    }
}

class Ecosystem {
    constructor(scene) {
        this.scene = scene;
        this.foodNodes = [];
        
        // Use InstancedMesh for performance
        this.foodGeo = new THREE.SphereGeometry(0.5, 8, 8);
        this.foodMat = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
        
        for(let i=0; i<150; i++) this.spawnFood();
    }

    spawnFood() {
        const mesh = new THREE.Mesh(this.foodGeo, this.foodMat);
        mesh.position.set((Math.random() - 0.5) * 200, 0, (Math.random() - 0.5) * 200);
        // Store base Y for hovering animation
        mesh.userData = { baseY: (Math.random() - 0.5) * 2, phase: Math.random() * Math.PI * 2 };
        this.scene.add(mesh);
        this.foodNodes.push(mesh);
    }

    update(dt, player) {
        const time = Date.now() * 0.002;
        for (let i = this.foodNodes.length - 1; i >= 0; i--) {
            const node = this.foodNodes[i];
            
            // Hover animation
            node.position.y = node.userData.baseY + Math.sin(time + node.userData.phase) * 1.5;

            // Collision / Consumption
            if (player.mesh.position.distanceTo(node.position) < 3.0) {
                player.energy += 40 * player.traits.gatherRate;
                this.scene.remove(node);
                this.foodNodes.splice(i, 1);
                this.spawnFood(); // Respawn to keep ecosystem populated
            }
        }
    }
}

/* =========================================
   4. CORE ENGINE & RENDERER
   ========================================= */
class Simulation {
    constructor() {
        this.ui = new UIController();
        this.initWebGL();
        
        this.player = new Player(this.scene);
        this.ecosystem = new Ecosystem(this.scene);
        
        this.targetPos = new THREE.Vector3();
        this.isPointerDown = false;
        this.hasEvolved = false;

        this.setupInputs();
        
        this.clock = new THREE.Clock();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
    }

    initWebGL() {
        this.scene = new THREE.Scene();
        this.scene.fog = new THREE.FogExp2(0x030308, 0.02);

        this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.camera.position.set(0, 40, 40);
        this.camera.lookAt(0, 0, 0);

        this.renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for low-end
        document.body.appendChild(this.renderer.domElement);

        // Environment grid (Subtle)
        const grid = new THREE.GridHelper(400, 100, 0x111122, 0x080811);
        grid.position.y = -5;
        this.scene.add(grid);

        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    setupInputs() {
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        const updateTarget = (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, this.camera);
            raycaster.ray.intersectPlane(plane, this.targetPos);
        };

        window.addEventListener('pointerdown', (e) => { this.isPointerDown = true; updateTarget(e); });
        window.addEventListener('pointermove', (e) => { if(this.isPointerDown) updateTarget(e); });
        window.addEventListener('pointerup', () => { this.isPointerDown = false; });
    }

    checkEvolutionTriggers() {
        // Trigger evolution phase when player hoards enough energy
        if (!this.hasEvolved && this.player.energy > 800) {
            this.hasEvolved = true;
            this.ui.showEvolutionPanel((selectedEvo) => {
                this.player.evolve(selectedEvo);
                this.ui.setStatus(selectedEvo.name);
            });
        }
    }

    animate() {
        requestAnimationFrame(this.animate);
        const dt = this.clock.getDelta();

        // Entity Movement Logic
        let moving = false;
        if (this.isPointerDown) {
            const dir = new THREE.Vector3().subVectors(this.targetPos, this.player.mesh.position);
            dir.y = 0; // Keep on plane
            if (dir.length() > 0.5) {
                moving = true;
                dir.normalize();
                // Speed scales with traits. Base speed mapping.
                const speedMulti = 15 * this.player.traits.speed;
                this.player.mesh.position.add(dir.multiplyScalar(speedMulti * dt));
            }
        }

        // Run Systems
        this.player.update(dt, moving);
        this.ecosystem.update(dt, this.player);
        this.checkEvolutionTriggers();

        // UI Updates
        this.ui.updateEnergy(this.player.energy, this.player.maxEnergy, this.player.traits.color);

        // Smooth Camera Follow
        this.camera.position.x += (this.player.mesh.position.x - this.camera.position.x) * 0.05;
        this.camera.position.z += (this.player.mesh.position.z + 40 - this.camera.position.z) * 0.05;
        
        // Camera breathes/zooms based on form (Alien zooms out for perception, Hybrid stays close)
        let targetY = 40;
        if(this.player.state === 'alien') targetY = 55;
        if(this.player.state === 'hybrid') targetY = 30;
        this.camera.position.y += (targetY - this.camera.position.y) * 0.02;
        
        this.camera.lookAt(this.player.mesh.position);

        this.renderer.render(this.scene, this.camera);
    }
}

// Boot the simulation
window.onload = () => {
    const sim = new Simulation();
};
</script>
</body>
</html>
