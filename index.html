<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis Evolution 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
    body { margin: 0; overflow: hidden; background: #060616; font-family: "Inter", Arial, sans-serif; touch-action: none; }
    #hud { position: fixed; top: 14px; left: 18px; color: #fff; font-size: 15px; text-shadow: 0 0 4px rgba(255,255,255,.3); z-index: 2; pointer-events: none; }
    #instructions { position: fixed; bottom: 14px; width: 100%; text-align: center; color: #aaa; font-size: 12px; pointer-events: none; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">Mass: <span id="mass">10</span>&nbsp; Score: <span id="score">0</span></div>
<div id="instructions">Click and hold to move. Eat yellow food. Avoid larger red foes.</div>

<script>
/* === CONSTANTS & SETUP === */
const W = window.innerWidth, H = window.innerHeight;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060616, 0.0008); // Gives the void depth

const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

/* === LIGHTING === */
const ambientLight = new THREE.AmbientLight(0x222233);
scene.add(ambientLight);

// A light that follows the player to create a glowing effect
const playerLight = new THREE.PointLight(0x00e4b8, 1.5, 800);
scene.add(playerLight);

/* === MATERIALS & GEOMETRIES === */
const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
const playerMat = new THREE.MeshStandardMaterial({ color: 0x00e4b8, emissive: 0x004433, roughness: 0.2 });
const foodMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x333300 });
const foeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 });

/* === WORLD DATA === */
let pMass = 10;
let pRadius = 10;
const player = new THREE.Mesh(sphereGeo, playerMat);
player.scale.set(pRadius, pRadius, pRadius);
scene.add(player);

const food = [];
const foes = [];

// Recreating the "Tesseract" grid background in 3D
const gridHelper = new THREE.GridHelper(4000, 50, 0x222222, 0x222222);
gridHelper.position.y = -10; // Place slightly below the play plane
scene.add(gridHelper);

/* === UTILITIES & SPAWNERS === */
const rand = v => Math.random() * v - v / 2;

function spawnFood() {
    const mesh = new THREE.Mesh(sphereGeo, foodMat);
    mesh.position.set(rand(2000), 0, rand(2000));
    const r = 6;
    mesh.scale.set(r, r, r);
    scene.add(mesh);
    food.push({ mesh, r });
}

function spawnFoe() {
    const mesh = new THREE.Mesh(sphereGeo, foeMat);
    mesh.position.set(rand(2500), 0, rand(2500));
    const r = 10 + Math.random() * 20;
    mesh.scale.set(r, r, r);
    scene.add(mesh);
    foes.push({ mesh, r });
}

// Initial Spawn
for(let i=0; i<80; i++) spawnFood();
for(let i=0; i<15; i++) spawnFoe();

/* === INPUT (Raycasting to X-Z plane) === */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let target = new THREE.Vector3();
let isMoving = false;

window.addEventListener('pointerdown', e => { isMoving = true; updateTarget(e); });
window.addEventListener('pointermove', e => { if(isMoving) updateTarget(e); });
window.addEventListener('pointerup', () => isMoving = false);

function updateTarget(e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    raycaster.ray.intersectPlane(floorPlane, target);
}

/* === GAME LOOP === */
const massEl = document.getElementById("mass");
const scoreEl = document.getElementById("score");
let lastTime = 0;

function animate(time) {
    requestAnimationFrame(animate);
    const dt = time - lastTime || 16;
    lastTime = time;

    /* Player Movement */
    if (isMoving && target) {
        const dir = new THREE.Vector3().subVectors(target, player.position);
        dir.y = 0; // Keep movement on the X-Z plane
        const dist = dir.length();
        if (dist > 1) {
            dir.normalize();
            // Speed logic mapped from 2D
            const speed = 2.5 * (1 + pMass * 0.0012) * (dt / 16);
            player.position.add(dir.multiplyScalar(speed));
        }
    }

    /* Mass Decay & Scaling */
    pMass = Math.max(5, pMass - (0.000009 * pRadius * pRadius + 0.002) * dt);
    pRadius = 10 + pMass / 15;
    player.scale.set(pRadius, pRadius, pRadius);
    playerLight.position.set(player.position.x, pRadius * 2, player.position.z);

    /* Camera Follow & Auto-Zoom */
    // Camera pulls back as you grow
    const camOffsetZ = pRadius * 6 + 100;
    const camOffsetY = pRadius * 8 + 150;
    
    // Smooth camera interpolation
    camera.position.x += (player.position.x - camera.position.x) * 0.1;
    camera.position.z += ((player.position.z + camOffsetZ) - camera.position.z) * 0.1;
    camera.position.y += (camOffsetY - camera.position.y) * 0.1;
    camera.lookAt(player.position);

    /* Food Collisions */
    for (let i = food.length - 1; i >= 0; i--) {
        const f = food[i];
        const d = player.position.distanceTo(f.mesh.position);
        if (d < pRadius + f.r) {
            pMass += f.r;
            scene.remove(f.mesh);
            food.splice(i, 1);
            spawnFood(); // Immediately respawn
        }
    }

    /* Foe Logic & Collisions */
    for (let i = foes.length - 1; i >= 0; i--) {
        const foe = foes[i];
        const d = player.position.distanceTo(foe.mesh.position);
        
        // Eat foe
        if (pRadius > foe.r && d < pRadius) {
            pMass += foe.r * 2.5;
            scene.remove(foe.mesh);
            foes.splice(i, 1);
            spawnFoe();
        } 
        // Get eaten/damaged by foe
        else if (foe.r > pRadius && d < foe.r) {
            pMass = Math.max(5, pMass - 0.04 * dt);
        }

        // Basic Foe AI
        if (d < 250) {
            const dir = new THREE.Vector3().subVectors(player.position, foe.mesh.position);
            dir.y = 0;
            dir.normalize();
            const moveAmt = 1.0 * (dt / 16);
            if (foe.r > pRadius) foe.mesh.position.add(dir.multiplyScalar(moveAmt)); // Chase
            else foe.mesh.position.sub(dir.multiplyScalar(moveAmt)); // Flee
        }
    }

    /* HUD Updates */
    massEl.textContent = pMass.toFixed(0);
    scoreEl.textContent = Math.floor(pMass * 10);

    /* Render */
    renderer.render(scene, camera);
}
requestAnimationFrame(animate);

/* === RESIZE HANDLING === */
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
